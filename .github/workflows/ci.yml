name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_frozen.py config/release-candidate-v10.json --revision 893be7c
      - run: python scripts/verify_frozen.py config/release-candidate-v11.json --revision 8d70a3b
      - run: python scripts/verify_release.py config/release-v0.1.0.json
      - run: python scripts/evaluate_gpt61_development.py --verify-only

  web-classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check dist/app.js
      - run: node --check dist/traceone.js
      - run: node scripts/test_web_classifier.mjs
      - run: node scripts/test_site_assets.mjs
